name: instagram-publish

on:
  schedule:
    # Hourly at :09 UTC. The publisher itself checks the runbook window,
    # so GitHub cron jitter (typically <15 min) only delays, never duplicates.
    - cron: "9 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate plan without publishing (no Graph writes)"
        type: boolean
        default: true
      slug:
        description: "Force a specific slug (e.g. D01-ig-limites)"
        type: string
        default: ""
      force:
        description: "Allow single-slug publish while scheduler is unarmed"
        type: boolean
        default: false

permissions:
  contents: write   # commit receipts back to state/published.json

concurrency:
  group: instagram-publish
  cancel-in-progress: false   # never cancel mid-publish

env:
  PYTHON_VERSION: "3.12"
  SCHEDULER_ENABLED: ${{ secrets.SCHEDULER_ENABLED }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Preflight - validate runbook + state
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          rb = json.loads(Path("publisher/runbook.json").read_text(encoding="utf-8"))
          st = json.loads(Path("publisher/state/published.json").read_text(encoding="utf-8")) if Path("publisher/state/published.json").exists() else {"published": {}}
          print(f"runbook: {len(rb['items'])} items, period {rb['period_start']}..{rb['period_end']}")
          print(f"state: {len(st.get('published', {}))} published so far")
          missing = [it["slug"] for it in rb["items"]
                     if not all((Path(it["assets"][k]) if isinstance(v, str) and not v.endswith("/")
                                 else Path(v)).exists()
                                for k, v in it["assets"].items() if isinstance(v, str) and not v.endswith("/"))]
          # carousel dirs are checked by the publisher itself; skip here
          if missing:
              print("MISSING assets:", missing); sys.exit(1)
          print("preflight OK")
          PY

      - name: Publish next due item
        id: pub
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_IG_ID: ${{ secrets.META_IG_ID }}
          META_API_VERSION: ${{ secrets.META_API_VERSION || 'v25.0' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          DRY_FLAG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then DRY_FLAG="--dry-run"; fi
          SLUG_FLAG=""
          if [ -n "${{ inputs.slug }}" ]; then SLUG_FLAG="--slug ${{ inputs.slug }}"; fi
          FORCE_FLAG=""
          if [ "${{ inputs.force }}" = "true" ]; then FORCE_FLAG="--force"; fi
          python publisher/publish_next.py $DRY_FLAG $SLUG_FLAG $FORCE_FLAG

      - name: Commit receipt (state/published.json)
        if: steps.pub.outcome == 'success' && !cancelled()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add publisher/state/published.json
          if ! git diff --cached --quiet; then
            git commit -m "receipt: instagram publish state update"
            git push
          else
            echo "no state change to commit"
          fi

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-log-${{ github.run_id }}
          path: |
            publisher/state/
            !publisher/state/*.tmp
          retention-days: 30
